spring.application.name=taskinator
server.port=${PORT:8080}

# DB
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${FLYWAY_USERNAME:${DB_USERNAME}}
spring.flyway.password=${FLYWAY_PASSWORD:${DB_PASSWORD}}

# JWT
application.jwt.secret=${JWT_SECRET}
application.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
application.jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

# Cookies
application.cookie.secure=true

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
