# Railway / Supabase production profile
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:taskinator}

spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

spring.flyway.schemas=${DB_SCHEMA:taskinator}
spring.flyway.default-schema=${DB_SCHEMA:taskinator}
spring.flyway.create-schemas=true
spring.flyway.placeholders.app_role=${DB_APP_ROLE:taskinator_app}
spring.flyway.placeholders.app_schema=${DB_SCHEMA:taskinator}

application.cookie.secure=true

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
